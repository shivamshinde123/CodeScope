[project]
name = "codescope"
version = "0.1.0"
description = "GitHub Action that generates visual Mermaid diagrams for pull requests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "unidiff>=0.7.5",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
