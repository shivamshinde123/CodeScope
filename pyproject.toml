[project]
name = "codescope"
version = "2.0.0"
description = "Evidence-backed blast radius and merge-readiness analysis for pull requests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "unidiff==0.7.5",
    "requests==2.32.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
