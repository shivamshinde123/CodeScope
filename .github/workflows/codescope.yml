name: CodeScope PR Visualizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  visualize:
    name: Generate PR Diagram
    runs-on: ubuntu-latest

    steps:
      - name: Run CodeScope
        uses: shivamshinde123/CodeScope@master
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
